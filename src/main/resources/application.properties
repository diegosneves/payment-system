server.port=${PORT:8080}
spring.application.name=payment-system

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_DATABASE:payment_system_db}?useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:local_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework=INFO
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.com.neves.paymentsystem=DEBUG

#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.url=/openapi.yaml
#springdoc.swagger-ui.path=/swagger-ui.html

# ======================
# LangChain4j - Ollama
# ======================
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_MODEL:qwen2.5-coder:7b}
langchain4j.ollama.embedding-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model.model-name=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
langchain4j.ollama.embedding-model.timeout=PT60S
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=PT120S
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

# RAG - Configuração do splitter
rag.max-segment-size=300
rag.max-overlap-size=30
