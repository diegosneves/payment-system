server.port=${PORT:8080}
spring.application.name=payment-system

spring.datasource.url=jdbc:tc:mysql:8.2.0-oraclelinux8:///${DB_DATABASE:payment_system_db}?useSSL=false
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:local_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework=INFO
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.com.neves.paymentsystem=DEBUG

#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.url=/openapi.yaml
#springdoc.swagger-ui.path=/swagger-ui.html
